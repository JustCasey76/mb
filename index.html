<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Market Basket Lynn Aisle Planner - Plan your grocery trips efficiently!" />
<title>Market Basket Lynn — Aisle Planner</title>
<link rel="icon" type="image/webp" href="favicon.webp" />
<style>
  :root {
    --gap: 10px;
    --bd: #e2e8f0;
    --muted: #64748b;
    --text: #0f172a;
    --primary: #0f766e;        /* MB teal */
    --primary-dark: #115e59;
    --accent: #dc2626;         /* MB red */
    --danger: #dc2626;
    --success: #16a34a;
    --bg: #f1f5f9;
    --card: #ffffff;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.06);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.08);
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    line-height: 1.5;
    margin: 0 auto;
    padding: 24px 18px 60px;
    max-width: 1000px;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .page-header {
    margin-bottom: 18px;
  }
  .page-header .subtitle {
    color: var(--muted);
    font-size: 14px;
  }
  .location-picker {
    margin-top: 10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: white;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    padding: 6px 10px 6px 12px;
    box-shadow: var(--shadow-sm);
  }
  .location-picker label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }
  .location-picker select {
    border: none;
    background: transparent;
    padding: 4px 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--primary);
    min-height: auto;
    cursor: pointer;
  }
  .location-picker select:focus { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }

  .row {
    display: flex;
    gap: var(--gap);
    flex-wrap: wrap;
    align-items: center;
  }

  input, button, select {
    padding: 10px 14px;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    font-size: 15px;
    min-height: 44px;
    font-family: inherit;
  }

  input[type="text"] {
    flex: 1;
    min-width: 200px;
    background: white;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.15);
  }

  button {
    background: var(--primary);
    color: white;
    border: 1px solid transparent;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  button:hover { background: var(--primary-dark); }
  button:active { transform: translateY(1px); }

  button.secondary {
    background: white;
    color: var(--text);
    border-color: var(--bd);
  }
  button.secondary:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
  }

  button.danger {
    background: white;
    color: var(--danger);
    border-color: #fecaca;
  }
  button.danger:hover {
    background: var(--danger);
    color: white;
    border-color: var(--danger);
  }

  button.toggle[aria-pressed="true"] {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--bd);
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .action-row .spacer { flex: 1; }

  #list { margin-top: 8px; }

  .aisle-group {
    background: var(--card);
    border: 1px solid var(--bd);
    border-radius: var(--radius-lg);
    margin-bottom: 12px;
    overflow: hidden;
    break-inside: avoid;
  }
  .aisle-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    border-bottom: 1px solid var(--bd);
  }
  .aisle-header h3 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--primary);
  }
  .aisle-header .count {
    font-size: 12px;
    color: var(--muted);
    background: white;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--bd);
  }
  .aisle-items { padding: 6px; }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    background: white;
    transition: background 0.12s;
  }
  .item + .item { margin-top: 2px; }
  .item:hover { background: #f8fafc; }

  .item-name { flex: 1; font-size: 15px; }

  .editable-name { cursor: pointer; }
  .editable-name:hover { color: var(--primary); }
  .editable-name.is-editing { cursor: text; }

  .editing-name-input {
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    font-size: 15px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    min-height: auto;
  }

  .item-aisle {
    background: #ecfdf5;
    color: var(--primary-dark);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    border: 1px solid #d1fae5;
  }
  .editable-aisle { cursor: pointer; transition: background 0.15s; }
  .editable-aisle:hover { background: #d1fae5; }

  .remove-btn {
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    font-size: 16px;
    padding: 6px 8px;
    min-height: auto;
    border-radius: 6px;
  }
  .remove-btn:hover { color: var(--danger); background: #fef2f2; }

  .muted { color: var(--muted); font-size: 14px; }

  .status {
    padding: 10px 14px;
    background: #f8fafc;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--muted);
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 8px;
    opacity: 0.5;
  }
  
  .print-only { display: none; }
  
  @media print {
    body {
      padding: 0;
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 11pt;
      line-height: 1.2;
    }
    
    .no-print {
      display: none !important;
    }
    
    .print-only {
      display: block;
      margin-bottom: 10px;
    }
    
    .print-only h1 {
      font-size: 16pt;
      margin: 0 0 2px 0;
      font-weight: bold;
    }
    
    .print-only #printDate {
      font-size: 9pt;
      color: #666;
      margin-bottom: 10px;
    }
    
    #list {
      margin: 0;
      padding: 0;
    }
    
    .item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border: none;
      box-shadow: none;
      background: none;
      margin: 0;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    
    .item-name {
      flex: 1;
      font-size: 11pt;
    }
    
    .item-aisle {
      background: none;
      color: #000;
      padding: 0;
      margin-left: 10px;
      font-size: 11pt;
      font-weight: normal;
    }
    
    .remove-btn {
      display: none;
    }
    
    @page {
      margin: 0.3in;
    }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.25s ease-out forwards; }

  #suggestions {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    margin-top: 4px;
    max-height: 240px;
    overflow-y: auto;
    display: none;
    z-index: 1000;
  }
  #suggestions > div {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 15px;
  }
  #suggestions > div:hover { background: #f1f5f9; }

  .view-toggle {
    display: inline-flex;
    background: white;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    padding: 3px;
    margin-bottom: 12px;
    gap: 2px;
  }
  .view-toggle button {
    background: transparent;
    color: var(--muted);
    border: none;
    min-height: 36px;
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 7px;
  }
  .view-toggle button.active {
    background: var(--primary);
    color: white;
  }
  .view-toggle button:not(.active):hover {
    background: #f1f5f9;
    color: var(--text);
  }

  .browse-panel {
    display: none;
    padding: 14px;
    border: 1px solid var(--bd);
    border-radius: var(--radius-lg);
    background: #f8fafc;
    margin-top: 12px;
  }

  .browse-toolbar {
    display: flex;
    gap: var(--gap);
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 10px;
  }

  .browse-summary {
    margin-left: auto;
    color: var(--muted);
    font-size: 13px;
  }

  .browse-list {
    max-height: 340px;
    overflow-y: auto;
    border: 1px solid var(--bd);
    border-radius: var(--radius);
    background: white;
  }

  .browse-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-bottom: 1px solid #f1f5f9;
  }
  .browse-item:last-child { border-bottom: none; }
  .browse-item input[type="checkbox"] {
    width: 18px; height: 18px;
    min-width: auto; min-height: auto;
    margin: 0;
    accent-color: var(--primary);
  }
  .browse-item-name { flex: 1; }
  .browse-item.disabled { background: #f8fafc; color: #94a3b8; }

  .browse-empty {
    padding: 20px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 640px) {
    body { padding: 16px 12px 50px; }
    h1 { font-size: 22px; }
    input, button, select { font-size: 14px; }
    .action-row button { flex: 1 1 auto; }
  }

  .hidden { display: none; }
</style>
</head>
<body>
  <div class="no-print">
    <header class="page-header">
      <h1>Market Basket — Aisle Planner</h1>
      <div class="subtitle" id="locationSubtitle">Plan your shop, walk the store in order.</div>
      <div class="location-picker">
        <label for="locationSelect">Store:</label>
        <select id="locationSelect">
          <option value="lynn">Lynn #82 — 40 Federal Street</option>
          <option value="middleton">Middleton #45 — 230 South Main Street</option>
        </select>
      </div>
    </header>

    <div class="card">
      <div class="view-toggle">
        <button id="searchModeBtn" type="button" class="active">Search / Add</button>
        <button id="browseModeBtn" type="button">Browse / Select</button>
      </div>

      <div class="controls">
        <div id="searchAddView" class="row" style="position: relative;">
          <input type="text" id="itemInput" placeholder="Type an item (e.g. ketchup, oreos, yogurt)..." autocomplete="off" />
          <button id="addBtn">Add</button>
          <div id="suggestions"></div>
        </div>

        <div id="browseView" class="browse-panel">
          <div class="browse-toolbar">
            <input type="text" id="browseFilterInput" placeholder="Filter all stored items..." style="flex: 1; min-width: 220px;" />
            <button id="selectVisibleBtn" type="button" class="secondary">Select Visible</button>
            <button id="clearBrowseSelectionBtn" type="button" class="secondary">Clear Selection</button>
            <button id="addSelectedBtn" type="button">Add Selected</button>
            <div id="browseSummary" class="browse-summary">Loading items...</div>
          </div>
          <div id="browseItems" class="browse-list"></div>
        </div>

        <div class="action-row">
          <button id="reverseOrderBtn" type="button" class="secondary toggle" aria-pressed="false" title="Toggle aisle sort direction">
            <span id="reverseOrderIcon">↓</span>
            <span id="reverseOrderLabel">Aisles: low → high</span>
          </button>
          <span class="spacer"></span>
          <button id="printBtn" class="secondary">Print</button>
          <button id="saveListBtn" class="secondary">Save</button>
          <button id="loadListBtn" class="secondary">Load</button>
          <button id="clearBtn" class="danger">Clear All</button>
        </div>
      </div>
    </div>

    <div id="savedListsPanel" class="card hidden">
      <h3 style="margin: 0 0 10px; font-size: 15px;">Saved Lists</h3>
      <div id="savedListsContainer"></div>
    </div>

    <div id="status" class="status">Loading aisle data...</div>
  </div>
  
  <div class="print-only">
    <h1>Market Basket Lynn — Shopping List</h1>
    <div id="printDate"></div>
  </div>
  
  <div id="list"></div>

  // Infer aisle for an arbitrary item name by scanning the guide + aliases.
  // Returns aisle string, or null if nothing matched.
  function inferAisle(rawName) {
    if (!rawName) return null;
    const name = rawName.toLowerCase().trim();
    if (!name) return null;

    // 1) exact match against guide items
    const exact = aisles.find(a => a.item.toLowerCase() === name);
    if (exact) return exact.aisle;

    // 2) substring match on guide item tokens (strip punctuation, compare word-by-word)
    //    score = length of the longest guide keyword found in the user's text
    let best = { score: 0, aisle: null };
    const nameClean = ' ' + name.replace(/[^a-z0-9& ]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

    for (const entry of aisles) {
      // guide items like "Cheese: Grated Parmesan" -> tokens: "cheese grated parmesan", plus each colon-separated phrase
      const raw = entry.item.toLowerCase();
      const phrases = raw.split(/[:,]/).map(s => s.trim()).filter(Boolean);
      // also try each hyphen-split alternative in phrases (e.g. "Canola-Cooking-Corn")
      const candidates = new Set();
      for (const p of phrases) {
        candidates.add(p);
        for (const piece of p.split(/[-/&]/)) {
          const t = piece.trim();
          if (t.length >= 3) candidates.add(t);
        }
      }
      for (const cand of candidates) {
        if (cand.length < 3) continue;
        if (nameClean.includes(' ' + cand + ' ') || nameClean.includes(cand)) {
          if (cand.length > best.score) best = { score: cand.length, aisle: entry.aisle };
        }
      }
    }

    // 3) keyword alias table (for brand names / common products not in the guide)
    for (const [kw, aisle] of getCurrentLocation().aliases) {
      if (nameClean.includes(kw)) {
        if (kw.length > best.score) best = { score: kw.length, aisle };
      }
    }

    return best.aisle;
  }

  function openMasterDatabase() {
    if (!('indexedDB' in window)) {
      return Promise.reject(new Error('This browser does not support IndexedDB'));
    }
    
    if (masterDbPromise) {
      return masterDbPromise;
    }
    
    masterDbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open(MASTER_DB.name, MASTER_DB.version);
      
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(MASTER_DB.store)) {
          db.createObjectStore(MASTER_DB.store, { keyPath: 'key' });
        }
      };
      
      request.onsuccess = () => {
        const db = request.result;
        db.onversionchange = () => {
          db.close();
          masterDbPromise = null;
        };
        resolve(db);
      };
      
      request.onerror = () => {
        masterDbPromise = null;
        reject(request.error || new Error('Unable to open the search database'));
      };
    });
    
    return masterDbPromise;
  }

  function buildMasterItemRecord(itemName, aisle, options = {}) {
    const cleanName = (itemName || '').toString().trim();
    if (!cleanName) return null;
    
    const normalizedAisle = normalizeAisle(aisle);
    const originalAisle = (options.originalAisle || normalizedAisle || 'Unknown').toString().trim() || 'Unknown';
    
    return {
      key: cleanName.toLowerCase(),
      item: cleanName,
      aisle: normalizedAisle,
      originalAisle,
      updatedAt: options.updatedAt || new Date().toISOString(),
      source: options.source || 'user'
    };
  }

  async function getAllMasterItems() {
    const db = await openMasterDatabase();
    
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MASTER_DB.store, 'readonly');
      const request = tx.objectStore(MASTER_DB.store).getAll();
      
      request.onsuccess = () => {
        const records = (request.result || []).sort((a, b) => a.item.localeCompare(b.item));
        resolve(records);
      };
      
      request.onerror = () => {
        reject(request.error || tx.error || new Error('Unable to read the search database'));
      };
    });
  }

  async function getMasterItemByName(itemName) {
    const cleanName = (itemName || '').toString().trim().toLowerCase();
    if (!cleanName) return null;
    
    const db = await openMasterDatabase();
    
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MASTER_DB.store, 'readonly');
      const request = tx.objectStore(MASTER_DB.store).get(cleanName);
      
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error || tx.error || new Error('Unable to read the search database'));
    });
  }

  async function putMasterItemRecord(record) {
    const db = await openMasterDatabase();
    
    return new Promise((resolve, reject) => {
      const tx = db.transaction(MASTER_DB.store, 'readwrite');
      const request = tx.objectStore(MASTER_DB.store).put(record);
      
      request.onsuccess = () => resolve(record);
      request.onerror = () => reject(request.error || tx.error || new Error('Unable to save to the search database'));
    });
  }

  async function upsertMasterItem(itemName, aisle, options = {}) {
    const record = buildMasterItemRecord(itemName, aisle, options);
    if (!record) {
      return { added: false, updated: false };
    }
    
    const existing = await getMasterItemByName(record.item);
    if (!existing) {
      await putMasterItemRecord(record);
      return { added: true, updated: false };
    }
    
    const nextRecord = { ...existing };
    let changed = false;
    const incomingKnownAisle = record.aisle && record.aisle !== 'Unknown';
    const existingKnownAisle = nextRecord.aisle && nextRecord.aisle !== 'Unknown';
    
    if (record.item !== nextRecord.item) {
      nextRecord.item = record.item;
      changed = true;
    }
    
    if (options.forceAisle) {
      if (nextRecord.aisle !== record.aisle || nextRecord.originalAisle !== record.originalAisle) {
        nextRecord.aisle = record.aisle;
        nextRecord.originalAisle = record.originalAisle;
        changed = true;
      }
    } else if (!existingKnownAisle && incomingKnownAisle) {
      nextRecord.aisle = record.aisle;
      nextRecord.originalAisle = record.originalAisle;
      changed = true;
    } else if (options.overwriteKnownAisle && incomingKnownAisle && nextRecord.aisle !== record.aisle) {
      nextRecord.aisle = record.aisle;
      nextRecord.originalAisle = record.originalAisle;
      changed = true;
    } else if (!nextRecord.aisle) {
      nextRecord.aisle = record.aisle;
      nextRecord.originalAisle = record.originalAisle;
      changed = true;
    }
    
    if (!changed) {
      return { added: false, updated: false };
    }
    
    nextRecord.updatedAt = options.updatedAt || new Date().toISOString();
    nextRecord.source = options.source || nextRecord.source || 'user';
    await putMasterItemRecord(nextRecord);
    
    return { added: false, updated: true };
  }

  async function seedMasterItems(rows, options = {}) {
    let addedCount = 0;
    let updatedCount = 0;
    
    for (const row of rows || []) {
      const result = await upsertMasterItem(
        row.item || row.name || '',
        row.aisle || row.section || row.location || 'Unknown',
        {
          source: options.source || 'seed',
          overwriteKnownAisle: !!options.overwriteKnownAisle,
          forceAisle: !!options.forceAisle,
          originalAisle: row.originalAisle || row.aisle || row.section || row.location || 'Unknown',
          updatedAt: options.updatedAt
        }
      );
      
      if (result.added) addedCount++;
      if (result.updated) updatedCount++;
    }
    
    return { addedCount, updatedCount };
  }

  function collectLegacyMasterRows() {
    const rows = [];
    
    try {
      const corrections = localStorage.getItem('mbAisleCorrections');
      if (corrections) {
        const correctionMap = JSON.parse(corrections);
        Object.keys(correctionMap).forEach(itemName => {
          rows.push({
            item: itemName,
            aisle: correctionMap[itemName],
            originalAisle: correctionMap[itemName]
          });
        });
      }
    } catch (error) {
      console.error('Error reading legacy aisle corrections:', error);
    }
    
    try {
      const masterList = localStorage.getItem('mbMasterList');
      if (masterList) {
        const masterListData = JSON.parse(masterList);
        masterListData.forEach(item => {
          rows.push({
            item: item.item,
            aisle: item.aisle || item.originalAisle || 'Unknown',
            originalAisle: item.originalAisle || item.aisle || 'Unknown'
          });
        });
      }
    } catch (error) {
      console.error('Error reading legacy master list:', error);
    }
    
    return rows;
  }

  async function migrateLegacyMasterData() {
    if (localStorage.getItem(MASTER_DB.migrationKey) === 'done') {
      return { addedCount: 0, updatedCount: 0 };
    }
    
    const legacyRows = collectLegacyMasterRows();
    const result = legacyRows.length
      ? await seedMasterItems(legacyRows, {
          source: 'localStorage-migration',
          overwriteKnownAisle: true,
          forceAisle: true
        })
      : { addedCount: 0, updatedCount: 0 };
    
    localStorage.setItem(MASTER_DB.migrationKey, 'done');
    return result;
  }

  async function refreshMasterItemsFromDb() {
    const masterItems = await getAllMasterItems();

    aisles = masterItems.map(item => ({
      item: item.item,
      aisle: normalizeAisle(item.aisle),
      originalAisle: item.originalAisle || item.aisle || 'Unknown'
    }));

    renderBrowseItems();
    return aisles;
  }

  // Re-infer aisles for items that were previously saved with "Unknown" (or no) aisle,
  // both in the current shopping list and in the searchable master database.
  async function reinferAislesForPastItems() {
    let listFixed = 0;
    for (const it of items) {
      const current = normalizeAisle(it.aisle);
      if (!current || current === 'Unknown') {
        const inferred = inferAisle(it.name);
        if (inferred) {
          it.aisle = inferred;
          listFixed++;
        }
      }
    }
    if (listFixed) saveState();

    let dbFixed = 0;
    try {
      const masterItems = await getAllMasterItems();
      for (const row of masterItems) {
        const current = normalizeAisle(row.aisle);
        if (!current || current === 'Unknown') {
          const inferred = inferAisle(row.item);
          if (inferred) {
            await upsertMasterItem(row.item, inferred, {
              source: 'pdf-inference-backfill',
              overwriteKnownAisle: true,
              originalAisle: inferred
            });
            dbFixed++;
          }
        }
      }
      if (dbFixed) await refreshMasterItemsFromDb();
    } catch (e) {
      console.error('Error re-inferring master DB aisles:', e);
    }

    if (listFixed || dbFixed) {
      render();
      setStatus(`Inferred aisles for ${listFixed} list item(s) and ${dbFixed} saved item(s)`);
    }
    return { listFixed, dbFixed };
  }
  
  function isItemInCurrentList(itemName) {
    const lowerName = (itemName || '').toString().trim().toLowerCase();
    return items.some(item => item.name.toLowerCase() === lowerName);

      els.browseModeBtn.classList.toggle('active', currentInputMode === 'browse');

  function getSortedBrowseItems() {
    return [...aisles].sort((a, b) => {
      const aisleCompare = (a.aisle || 'Unknown').localeCompare(b.aisle || 'Unknown', undefined, { numeric: true });
      if (aisleCompare !== 0) return aisleCompare;
      return a.item.localeCompare(b.item);
    });
  }
  
  function getVisibleBrowseItems() {
    const filterTerms = browseFilter.toLowerCase().split(/\s+/).filter(Boolean);
    const allItems = getSortedBrowseItems();
    
    if (filterTerms.length === 0) {
      return allItems;
    }
    
    return allItems.filter(item => {
      const haystack = `${item.item} ${item.aisle || ''}`.toLowerCase();
      return filterTerms.every(term => haystack.includes(term));
    });
  }
  
  function renderBrowseItems() {
    if (!els.browseItems || !els.browseSummary) return;
    
    const validKeys = new Set(aisles.map(item => item.item.toLowerCase()));
    browseSelections = new Set(
      [...browseSelections].filter(key => validKeys.has(key) && !isItemInCurrentList(key))
    );
    
    const visibleItems = getVisibleBrowseItems();
    
    els.browseSummary.textContent = `${browseSelections.size} selected | ${visibleItems.length} visible`;
    
    if (visibleItems.length === 0) {
      els.browseItems.innerHTML = '<div class="browse-empty">No items match this filter.</div>';
      return;
    }
    
    els.browseItems.innerHTML = visibleItems.map(item => {
      const itemKey = item.item.toLowerCase();
      const inList = isItemInCurrentList(item.item);
      if (inList) {
        browseSelections.delete(itemKey);
      }
      const checked = browseSelections.has(itemKey) ? 'checked' : '';
      const disabled = inList ? 'disabled' : '';
      const rowClass = inList ? 'browse-item disabled' : 'browse-item';
      const suffix = inList
        ? '<span class="muted">Already in list</span>'
        : '';
      
      return `
        <label class="${rowClass}">
          <input type="checkbox" class="browse-checkbox" data-item-key="${escapeHtml(itemKey)}" ${checked} ${disabled} />
          <span class="browse-item-name">${escapeHtml(item.item)}</span>
          <span class="item-aisle">${escapeHtml(item.aisle || 'Unknown')}</span>
          ${suffix}
        </label>
      `;
    }).join('');
    
    document.querySelectorAll('.browse-checkbox').forEach(checkbox => {
      checkbox.addEventListener('change', (event) => {
        const itemKey = event.target.getAttribute('data-item-key');
        if (!itemKey) return;
        
        if (event.target.checked) {
          browseSelections.add(itemKey);
        } else {
          browseSelections.delete(itemKey);
        }
        
        els.browseSummary.textContent = `${browseSelections.size} selected | ${visibleItems.length} visible`;
      });
    });
  }

  // Normalize aisle names for consistency
  function normalizeAisle(v) {
    if (!v) return 'Unknown';
    
    // Convert to string and clean up
    v = v.toString().trim();
    
    // Standardize aisle names
    v = v.replace(/Dept(?:artment)?(\/|$)/gi, '').trim();
    v = v.replace(/\s*\/\s*/g, '/');
    v = v.replace(/\s+/g, ' ');
    
    // Specific normalizations for common departments
    if (/^\s*produce|fruit|vegetable/i.test(v)) return 'Produce';
    if (/^\s*bakery|bread|cake|donut|pastry/i.test(v)) return 'Bakery';
    if (/^\s*(?:deli|fish|seafood)/i.test(v)) return 'Deli/Fish';
    if (/^\s*meat/i.test(v)) return 'Meat';
    if (/^\s*(?:frozen|ice\s*cream|ice\s*cream)/i.test(v)) return 'Frozen';
    if (/^\s*dairy|cheese|milk|yogurt|butter/i.test(v)) return 'Dairy';
    if (/^\s*breakfast|cereal|oatmeal/i.test(v)) return 'Breakfast';
    if (/^\s*beverage|drink|soda|water|juice/i.test(v)) return 'Beverages';
    if (/^\s*snack|candy|chips|cookie|cracker/i.test(v)) return 'Snacks';
    
    // Clean up aisle numbers (e.g., "Aisle 5" -> "5")
    const aisleNumMatch = v.match(/^\s*(?:aisle\s*)?(\d+[a-z]?)(?:\s*[-&]\s*(\d+[a-z]?))?\s*$/i);
    if (aisleNumMatch) {
      return aisleNumMatch[2] 
        ? `${aisleNumMatch[1]}-${aisleNumMatch[2]}`
        : aisleNumMatch[1];
    }
    
    return v || 'Unknown';
  }
  
  // Process and apply aisle data
  function applyData(rows) {
    if (!Array.isArray(rows)) {
      setStatus('Invalid data format: expected an array of items', true);
      return false;
    }
    
    // Process the data
    aisles = rows
      .map(row => {
        // Handle different possible property names
        const itemName = (row.item || row.name || '').toString().trim();
        const aisle = normalizeAisle(row.aisle || row.section || row.location || '');
        
        return {
          item: itemName,
          aisle: aisle,
          originalAisle: row.aisle || '' // Keep original for reference
        };
      })
      .filter(x => x.item); // Remove empty items
    
    setStatus(`Loaded ${aisles.length} items`);
    return true;
  }
  
  // Show suggestions based on search input
  function showSuggestions(searchTerm) {
    const suggestionsEl = document.getElementById('suggestions');
    suggestionsEl.innerHTML = '';
    
    if (!searchTerm) {
      suggestionsEl.style.display = 'none';
      return;
    }
    
    const searchLower = searchTerm.toLowerCase();
    const searchTerms = searchLower.split(' ').filter(Boolean);
    const uniqueItems = {};
    let matchCount = 0;
    
    // Find matching items
    const matches = [];
    for (const item of aisles) {
      const lowerItem = item.item.toLowerCase();
      // Remove special characters for better matching
      const cleanItem = lowerItem.replace(/[:\-,]/g, ' ').replace(/\s+/g, ' ');
      
      // Check if all search terms are in the item (in cleaned version or original)
      const matchesAllTerms = searchTerms.every(term => 
        lowerItem.includes(term) || cleanItem.includes(term)
      );
      
      if (matchesAllTerms && !uniqueItems[lowerItem]) {
        matches.push(item);
        uniqueItems[lowerItem] = true;
        matchCount++;
        
        if (matchCount >= 10) break; // Limit to 10 suggestions
      }
    }
    
    // Display suggestions
    if (matches.length > 0) {
      matches.forEach(item => {
        const div = document.createElement('div');
        div.textContent = item.item;
        div.style.padding = '8px 12px';
        div.style.cursor = 'pointer';
        div.onmouseover = () => div.style.backgroundColor = '#f5f5f5';
        div.onmouseout = () => div.style.backgroundColor = 'transparent';
        div.onclick = () => {
          els.input.value = item.item;
          suggestionsEl.style.display = 'none';
          els.input.focus();
        };
        suggestionsEl.appendChild(div);
      });
      suggestionsEl.style.display = 'block';
      setStatus(`Found ${matches.length} matching items`);
    } else {
      suggestionsEl.style.display = 'none';
      setStatus('No matching items found', true);
    }
  }
  
  // Render the shopping list
  function render() {
    if (!els.list) return;
    
    // Sort items by aisle
    const sortedItems = [...items].sort((a, b) => {
      const aisleA = a.aisle || 'Unknown';
      const aisleB = b.aisle || 'Unknown';
      
      // Check if both are numbers or numeric ranges
      const aIsNumeric = /^\d+(-\d+)?$/.test(aisleA);
      const bIsNumeric = /^\d+(-\d+)?$/.test(aisleB);
      
      // Both numeric - sort numerically
      if (aIsNumeric && bIsNumeric) {
        const aNum = parseInt(aisleA.split('-')[0]);
        const bNum = parseInt(aisleB.split('-')[0]);
        const aisleCompare = aNum - bNum;
        if (aisleCompare !== 0) return reverseAisles ? -aisleCompare : aisleCompare;
        // Same aisle, sort by name
        return a.name.localeCompare(b.name);
      }
      
      // One is numeric, one is not - numeric comes first
      if (aIsNumeric) return reverseAisles ? 1 : -1;
      if (bIsNumeric) return reverseAisles ? -1 : 1;
      
      // Both non-numeric - sort alphabetically
      const aisleCompare = aisleA.localeCompare(aisleB);
      if (aisleCompare !== 0) return reverseAisles ? -aisleCompare : aisleCompare;
      // Same aisle, sort by name
      return a.name.localeCompare(b.name);
    });
    
    // Group items by aisle and render as aisle cards
    let html = '';
    if (sortedItems.length > 0) {
      const groups = [];
      let currentKey = null;
      for (const item of sortedItems) {
        const key = item.aisle || 'Unknown';
        if (key !== currentKey) {
          groups.push({ aisle: key, items: [] });
          currentKey = key;
        }
        groups[groups.length - 1].items.push(item);
      }

      html = groups.map(g => {
        const label = g.aisle === 'Unknown' ? 'Unknown aisle' : `Aisle ${g.aisle}`;
        const itemsHtml = g.items.map(item => `
          <div class="item fade-in" data-id="${item.id}">
            <span class="item-name editable-name" data-id="${item.id}" title="Click to rename">${escapeHtml(item.name)}</span>
            <span class="item-aisle editable-aisle" data-id="${item.id}" title="Click to edit aisle">${g.aisle === 'Unknown' ? '?' : escapeHtml(g.aisle)}</span>
            <button class="remove-btn" data-id="${item.id}" title="Remove item">✕</button>
          </div>`).join('');
        return `
          <div class="aisle-group">
            <div class="aisle-header">
              <h3>${escapeHtml(label)}</h3>
              <span class="count">${g.items.length} item${g.items.length === 1 ? '' : 's'}</span>
            </div>
            <div class="aisle-items">${itemsHtml}</div>
          </div>`;
      }).join('');
    }

    els.list.innerHTML = html || `
      <div class="empty-state">
        <div class="icon">🛒</div>
        <div>Your shopping list is empty.</div>
        <div class="muted" style="margin-top:4px;">Type an item above to get started.</div>
      </div>`;
    
    // Add click handlers to remove buttons
    document.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent event bubbling
        const id = parseInt(btn.getAttribute('data-id'));
        const item = items.find(i => i.id === id);
        if (item && confirm(`Remove "${item.name}" from your list?`)) {
          removeItem(id);
        }
      });
    });
    
    // Add click handlers to editable aisle numbers
    document.querySelectorAll('.editable-aisle').forEach(aisleEl => {
      aisleEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(aisleEl.getAttribute('data-id'));
        const item = items.find(i => i.id === id);
        if (!item) return;
        
        const currentAisle = item.aisle || 'Unknown';
        const newAisle = prompt(`Edit aisle for "${item.name}":\n\n(Enter aisle number or name like "Produce", "Bakery", etc.)`, currentAisle === 'Unknown' ? '' : currentAisle);
        
        if (newAisle !== null && newAisle.trim() !== '') {
          updateItemAisle(id, newAisle.trim());
        }
      });
    });
    
    document.querySelectorAll('.editable-name').forEach(nameEl => {
      nameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(nameEl.getAttribute('data-id'));
        startInlineRename(id);
      });
    });
    
    renderBrowseItems();
  }
  
  async function addItemByName(rawName, options = {}) {
    const name = (rawName || '').trim();
    if (!name) {
      if (options.focusInput !== false) {
        els.input.focus();
      }
      return { added: false, reason: 'empty' };
    }
    
    const existingItem = items.find(item => item.name.toLowerCase() === name.toLowerCase());
    if (existingItem) {
      if (options.reportDuplicate !== false) {
        setStatus(`"${name}" is already in your list`, true);
      }
      return { added: false, reason: 'duplicate' };
    }
    
    const foundItem = aisles.find(item => item.item.toLowerCase() === name.toLowerCase());
    let aisle = foundItem ? foundItem.aisle : null;

    // Fuzzy / keyword inference against the Shoppers' Guide
    if (!aisle) {
      const inferred = inferAisle(name);
      if (inferred) aisle = inferred;
    }

    if (!aisle) {
      aisle = 'Unknown';
    }
    
    const newItem = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      name,
      aisle,
      added: new Date().toISOString()
    };
    
    items.push(newItem);
    
    if (options.clearInput) {
      els.input.value = '';
    }
    if (options.hideSuggestions) {
      document.getElementById('suggestions').style.display = 'none';
    }
    if (options.focusInput) {
      els.input.focus();
    }
    
    saveState();
    render();
    
    try {
      await upsertMasterItem(name, aisle, {
        source: options.source || 'shopping-list-entry',
        overwriteKnownAisle: aisle !== 'Unknown',
        originalAisle: aisle
      });
      await refreshMasterItemsFromDb();
    } catch (error) {
      console.error('Error saving item to search database:', error);
      setStatus(`Added "${name}" to your list, but could not save it for search`, true);
      return { added: true, item: newItem, warning: 'db-save-failed' };
    }
    
    if (options.scrollToItem !== false) {
      setTimeout(() => {
        const newItemEl = document.querySelector(`[data-id="${newItem.id}"]`);
        if (newItemEl) {
          newItemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }
    
    if (options.reportStatus !== false) {
      setStatus(`Added: ${name} (Aisle ${aisle})`);
    }
    
    return { added: true, item: newItem };
  }
  
  // Add a new item to the list
  async function addItem() {
    await addItemByName(els.input.value, {
      clearInput: true,
      hideSuggestions: true,
      focusInput: true,
      allowPrompt: true,
      reportStatus: true,
      scrollToItem: true,
      source: 'shopping-list-entry'
    });
  }
  
  async function addSelectedBrowseItems() {
    const selectedItems = getSortedBrowseItems().filter(item =>
      browseSelections.has(item.item.toLowerCase()) && !isItemInCurrentList(item.item)
    );
    
    if (selectedItems.length === 0) {
      setStatus('Select at least one item from Browse / Select first', true);
      return;
    }
    
    let addedCount = 0;
    
    for (const item of selectedItems) {
      const result = await addItemByName(item.item, {
        allowPrompt: false,
        focusInput: false,
        reportDuplicate: false,
        reportStatus: false,
        scrollToItem: false,
        source: 'browse-select'
      });
      
      if (result.added) {
        addedCount++;
        browseSelections.delete(item.item.toLowerCase());
      }
    }
    
    renderBrowseItems();
    setStatus(
      addedCount > 0
        ? `${addedCount} selected item${addedCount !== 1 ? 's' : ''} added to your list`
        : 'Selected items were already in your list'
    );
  }
  
  // Remove an item by ID
  function removeItem(id) {
    const index = items.findIndex(item => item.id === id);
    if (index !== -1) {
      const removed = items.splice(index, 1)[0];
      saveState();
      render();
      setStatus(`Removed: ${removed.name}`);
    }
  }
  
  function startInlineRename(id) {
    if (editingItemNameId === id) return;
    if (editingItemNameId !== null) return;
    
    const item = items.find(i => i.id === id);
    const nameEl = document.querySelector(`.editable-name[data-id="${id}"]`);
    if (!item || !nameEl) return;
    
    editingItemNameId = id;
    nameEl.classList.add('is-editing');
    nameEl.textContent = '';
    
    const input = document.createElement('input');
    input.type = 'text';
    input.value = item.name;
    input.className = 'editing-name-input';
    input.setAttribute('aria-label', `Rename ${item.name}`);
    nameEl.appendChild(input);
    
    let finished = false;
    const finish = async (shouldSave) => {
      if (finished) return;
      finished = true;
      
      const nextValue = input.value.trim();
      editingItemNameId = null;
      
      if (!shouldSave || !nextValue || nextValue === item.name) {
        render();
        return;
      }
      
      await updateItemName(id, nextValue);
    };
    
    input.addEventListener('keydown', async (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        await finish(true);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        await finish(false);
      }
    });
    
    input.addEventListener('blur', async () => {
      await finish(true);
    });
    
    input.focus();
    input.select();
  }
  
  async function updateItemName(id, newName) {
    const item = items.find(i => i.id === id);
    if (!item) return false;
    
    const trimmedName = (newName || '').trim();
    if (!trimmedName) {
      setStatus('Item name cannot be empty', true);
      render();
      return false;
    }
    
    const duplicate = items.find(i =>
      i.id !== id && i.name.toLowerCase() === trimmedName.toLowerCase()
    );
    
    if (duplicate) {
      setStatus(`"${trimmedName}" is already in your list`, true);
      render();
      return false;
    }
    
    const oldName = item.name;
    item.name = trimmedName;
    
    saveState();
    render();
    
    try {
      await upsertMasterItem(trimmedName, item.aisle || 'Unknown', {
        source: 'rename-item',
        overwriteKnownAisle: (item.aisle || 'Unknown') !== 'Unknown',
        originalAisle: item.aisle || 'Unknown'
      });
      await refreshMasterItemsFromDb();
    } catch (error) {
      console.error('Error saving renamed item to search database:', error);
      setStatus(`Renamed "${oldName}" to "${trimmedName}", but could not save it for search`, true);
      return false;
    }
    
    setStatus(`Renamed "${oldName}" to "${trimmedName}"`);
    return true;
  }
  
  // Update an item's aisle
  async function updateItemAisle(id, newAisle) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    
    const normalizedAisle = normalizeAisle(newAisle);
    item.aisle = normalizedAisle;
    
    // Update the aisles data array
    const aisleDataItem = aisles.find(a => a.item.toLowerCase() === item.name.toLowerCase());
    if (aisleDataItem) {
      aisleDataItem.aisle = normalizedAisle;
    } else {
      // If item doesn't exist in aisles data, add it
      aisles.push({
        item: item.name,
        aisle: normalizedAisle,
        originalAisle: normalizedAisle
      });
    }
    
    try {
      await upsertMasterItem(item.name, normalizedAisle, {
        source: 'aisle-edit',
        overwriteKnownAisle: true,
        forceAisle: true,
        originalAisle: normalizedAisle
      });
      await refreshMasterItemsFromDb();
    } catch (error) {
      console.error('Error saving aisle update to search database:', error);
      setStatus(`Updated "${item.name}" in your list, but could not save the aisle change`, true);
      saveState();
      render();
      return;
    }
    
    saveState();
    render();
    setStatus(`Updated: ${item.name} moved to Aisle ${normalizedAisle}`);
  }
  
  // Add all items from current shopping list to master list
  async function addCurrentListToMaster() {
    if (items.length === 0) {
      setStatus('Cannot add items: shopping list is empty', true);
      return;
    }
    
    let addedCount = 0;
    let updatedCount = 0;
    
    for (const shoppingItem of items) {
      const itemName = shoppingItem.name;
      const itemAisle = shoppingItem.aisle || 'Unknown';

      try {
        const result = await upsertMasterItem(itemName, itemAisle, {
          source: 'manual-sync',
          overwriteKnownAisle: itemAisle !== 'Unknown',
          originalAisle: itemAisle
        });
        
        if (result.added) addedCount++;
        if (result.updated) updatedCount++;
      } catch (error) {
        console.error('Error syncing item to search database:', error);
      }
    }

    try {
      await refreshMasterItemsFromDb();
    } catch (error) {
      console.error('Error refreshing search database cache:', error);
    }
    
    // Show summary message
    const messages = [];
    if (addedCount > 0) {
      messages.push(`${addedCount} new item${addedCount !== 1 ? 's' : ''} added`);
    }
    if (updatedCount > 0) {
      messages.push(`${updatedCount} item${updatedCount !== 1 ? 's' : ''} updated`);
    }
    
    if (messages.length > 0) {
      setStatus(`Search database updated: ${messages.join(', ')}.`);
    } else {
      setStatus('Search database already had the same items and aisles');
    }
  }
  
  // Export aisle data as JSON file
  function exportAisleData() {
    const dataToExport = aisles.map(item => ({
      item: item.item,
      aisle: item.aisle
    }));
    
    const dataStr = JSON.stringify(dataToExport, null, 2);
    const dataBlob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(dataBlob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = 'mb_lynn_82_aisles_updated.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    
    setStatus('Aisle data exported successfully');
  }
  
  // Save current list with a name
  function saveCurrentList() {
    if (items.length === 0) {
      setStatus('Cannot save an empty list', true);
      return;
    }
    
    const listName = prompt('Enter a name for this list:');
    if (!listName || !listName.trim()) {
      return;
    }
    
    const trimmedName = listName.trim();
    
    // Get saved lists from localStorage
    const savedLists = getSavedLists();
    
    // Check if name already exists
    if (savedLists[trimmedName]) {
      if (!confirm(`A list named "${trimmedName}" already exists. Overwrite it?`)) {
        return;
      }
    }
    
    // Save the list
    savedLists[trimmedName] = {
      items: items.map(item => ({ ...item })),
      reverseAisles: reverseAisles,
      savedAt: new Date().toISOString()
    };
    
    localStorage.setItem('mbSavedLists', JSON.stringify(savedLists));
    
    setStatus(`List "${trimmedName}" saved successfully`);
    renderSavedLists();
  }
  
  // Get all saved lists from localStorage
  function getSavedLists() {
    try {
      const saved = localStorage.getItem('mbSavedLists');
      return saved ? JSON.parse(saved) : {};
    } catch (e) {
      console.error('Error loading saved lists:', e);
      return {};
    }
  }
  
  // Load a saved list
  function loadSavedList(listName) {
    const savedLists = getSavedLists();
    const savedList = savedLists[listName];
    
    if (!savedList) {
      setStatus(`List "${listName}" not found`, true);
      return;
    }
    
    if (items.length > 0) {
      if (!confirm('Loading a saved list will replace your current list. Continue?')) {
        return;
      }
    }
    
    // Load the items
    items = savedList.items.map(item => ({ ...item }));
    
    // Load settings
    if (savedList.reverseAisles !== undefined) {
      reverseAisles = savedList.reverseAisles;
      updateReverseOrderButton();
    }
    
    
    // Save current state and render
    saveState();
    render();
    setStatus(`Loaded list "${listName}"`);
    
    // Hide the saved lists panel
    els.savedListsPanel.style.display = 'none';
  }
  
  // Delete a saved list
  function deleteSavedList(listName) {
    if (!confirm(`Are you sure you want to delete the list "${listName}"?`)) {
      return;
    }
    
    const savedLists = getSavedLists();
    delete savedLists[listName];
    localStorage.setItem('mbSavedLists', JSON.stringify(savedLists));
    
    setStatus(`List "${listName}" deleted`);
    renderSavedLists();
  }
  
  // Toggle saved lists panel
  function toggleSavedListsPanel() {
    const isVisible = els.savedListsPanel.style.display !== 'none';
    els.savedListsPanel.style.display = isVisible ? 'none' : 'block';
    
    if (!isVisible) {
      renderSavedLists();
    }
  }
  
  // Render the saved lists panel
  function renderSavedLists() {
    const savedLists = getSavedLists();
    const listNames = Object.keys(savedLists).sort();
    
    if (listNames.length === 0) {
      els.savedListsContainer.innerHTML = '<p class="muted" style="margin: 0;">No saved lists yet. Save your current list to get started.</p>';
      return;
    }
    
    let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
    
    listNames.forEach(listName => {
      const savedList = savedLists[listName];
      const itemCount = savedList.items ? savedList.items.length : 0;
      const savedDate = savedList.savedAt ? new Date(savedList.savedAt).toLocaleString() : 'Unknown date';
      
      html += `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; border-radius: 4px; border: 1px solid #ddd;">
          <div style="flex: 1;">
            <div style="font-weight: 500; margin-bottom: 4px;">${escapeHtml(listName)}</div>
            <div class="muted" style="font-size: 12px;">${itemCount} item${itemCount !== 1 ? 's' : ''} • Saved ${savedDate}</div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="secondary load-list-btn" data-list-name="${escapeHtml(listName)}" style="padding: 6px 12px; font-size: 13px; min-height: auto;">Load</button>
            <button class="danger delete-list-btn" data-list-name="${escapeHtml(listName)}" style="padding: 6px 12px; font-size: 13px; min-height: auto;">Delete</button>
          </div>
        </div>
      `;
    });
    
    html += '</div>';
    els.savedListsContainer.innerHTML = html;
    
    // Add event listeners to the buttons
    document.querySelectorAll('.load-list-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const listName = e.target.getAttribute('data-list-name');
        if (listName) {
          loadSavedList(listName);
        }
      });
    });
    
    document.querySelectorAll('.delete-list-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const listName = e.target.getAttribute('data-list-name');
        if (listName) {
          deleteSavedList(listName);
        }
      });
    });
  }
  
  // Handle file upload
  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    
    reader.onload = function(e) {
      try {
        let data;
        
        // Try to parse as JSON
        if (file.name.endsWith('.json')) {
          data = JSON.parse(e.target.result);
        } 
        // Try to parse as CSV
        else if (file.name.endsWith('.csv')) {
          data = parseCSV(e.target.result);
        } else {
          throw new Error('Unsupported file format. Please use .json or .csv');
        }
        
        if (applyData(data)) {
          setStatus(`Successfully loaded ${data.length} items from ${file.name}`);
          saveState();
        }
      } catch (error) {
        setStatus(`Error loading file: ${error.message}`, true);
        console.error('File load error:', error);
      }
    };
    
    reader.onerror = function() {
      setStatus('Error reading file', true);
    };
    
    if (file.name.endsWith('.csv')) {
      reader.readAsText(file);
    } else {
      reader.readAsText(file);
    }
    
    // Reset the file input
    event.target.value = '';
  }
  
  // Parse CSV data
  function parseCSV(csvText) {
    const lines = csvText.split('\n').filter(line => line.trim() !== '');
    if (lines.length < 1) return [];
    
    // Try to detect the delimiter
    const firstLine = lines[0];
    let delimiter = ',';
    if (firstLine.includes('\t')) delimiter = '\t';
    else if (firstLine.includes(';')) delimiter = ';';
    
    // Parse headers (first row)
    const headers = lines[0].split(delimiter).map(h => h.trim().toLowerCase());
    
    // Check if we have required columns
    const hasItem = headers.some(h => h.includes('item') || h.includes('name'));
    const hasAisle = headers.some(h => h.includes('aisle') || h.includes('section'));
    
    if (!hasItem || !hasAisle) {
      throw new Error('CSV must contain "item" and "aisle" columns');
    }
    
    // Get column indices
    const itemIndex = headers.findIndex(h => h.includes('item') || h.includes('name'));
    const aisleIndex = headers.findIndex(h => h.includes('aisle') || h.includes('section'));
    
    // Parse data rows
    return lines.slice(1).map(line => {
      const values = line.split(delimiter).map(v => v.trim().replace(/^"|"$/g, ''));
      return {
        item: values[itemIndex] || '',
        aisle: values[aisleIndex] || 'Unknown'
      };
    }).filter(row => row.item); // Remove empty rows
  }
  
  // Load data from URL
  async function loadFromUrl() {
    const url = els.urlInput.value.trim();
    if (!url) {
      setStatus('Please enter a URL', true);
      return;
    }
    
    try {
      setStatus('Loading data from URL...');
      
      const response = await fetch(url, { cache: 'no-cache' });
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      let data;
      
      if (url.endsWith('.json')) {
        data = await response.json();
      } else if (url.endsWith('.csv')) {
        const csvText = await response.text();
        data = parseCSV(csvText);
      } else {
        // Try to auto-detect format
        const text = await response.text();
        try {
          // Try to parse as JSON
          data = JSON.parse(text);
        } catch (e) {
          // Try to parse as CSV
          data = parseCSV(text);
        }
      }
      
      if (applyData(data)) {
        setStatus(`Successfully loaded ${data.length} items from URL`);
        saveState();
        els.urlInput.value = ''; // Clear the URL input
      }
    } catch (error) {
      setStatus(`Error loading from URL: ${error.message}`, true);
      console.error('URL load error:', error);
    }
  }
  
  async function getDefaultAisleRows() {
    try {
      const response = await fetch(getCurrentLocation().file, { cache: 'no-cache' });
      if (response.ok) {
        const data = await response.json();
        return { rows: data, source: 'JSON file' };
      }
    } catch (fetchError) {
      console.log('Could not load JSON file, trying fallbacks:', fetchError);
    }
    
    const embedded = getCurrentLocation().embedded;
    if (embedded && embedded.length > 0) {
      return { rows: embedded, source: 'embedded data' };
    }
    
    try {
      const savedAisles = localStorage.getItem('mbAisles');
      if (savedAisles) {
        const data = JSON.parse(savedAisles);
        if (data && Array.isArray(data.data)) {
          return { rows: data.data, source: 'cached aisle data' };
        }
      }
    } catch (error) {
      console.error('Error reading cached aisle data:', error);
    }
    
    return { rows: [], source: '' };
  }
  
  // Load aisle data from the default location
  async function loadAisleData(options = {}) {
    try {
      setStatus('Loading aisle data...');

      const defaultData = await getDefaultAisleRows();
      await openMasterDatabase();

      if (defaultData.rows.length > 0) {
        await seedMasterItems(defaultData.rows, {
          source: `${getCurrentLocation().id}-${defaultData.source || 'default-data'}`,
          overwriteKnownAisle: !!options.forceOverwrite,
          forceAisle: !!options.forceOverwrite
        });
      }

      if (!options.forceOverwrite) {
        await migrateLegacyMasterData();
      }
      await refreshMasterItemsFromDb();
      await applyLocationToCurrentList();
      await reinferAislesForPastItems();

      if (aisles.length > 0) {
        setStatus(`Loaded ${aisles.length} items for ${getCurrentLocation().name}`);
      } else {
        setStatus('No aisle data available', true);
      }
    } catch (error) {
      console.error('Error loading aisle data:', error);
      setStatus('Error loading aisle data. Some features may be limited.', true);
    }
  }

  // When location changes, re-map aisles on current list items where we have an exact
  // guide entry for that item in the new location.
  async function applyLocationToCurrentList() {
    let changed = 0;
    for (const it of items) {
      const match = aisles.find(a => a.item.toLowerCase() === it.name.toLowerCase());
      if (match && match.aisle && match.aisle !== it.aisle) {
        it.aisle = match.aisle;
        changed++;
      }
    }
    if (changed) saveState();
  }

  async function switchLocation(newId) {
    if (!LOCATIONS[newId] || newId === currentLocationId) return;
    currentLocationId = newId;
    localStorage.setItem('mbLocationId', currentLocationId);
    updateLocationHeader();
    await loadAisleData({ forceOverwrite: true });
    render();
  }

  function updateLocationHeader() {
    const loc = getCurrentLocation();
    if (els.locationSubtitle) els.locationSubtitle.textContent = loc.subtitle;
    if (els.locationSelect) els.locationSelect.value = currentLocationId;
  }
  
  // Save current state to localStorage
  function saveState() {
    try {
      localStorage.setItem('mbShoppingList', JSON.stringify({
        items: items,
        reverseAisles: reverseAisles,
        version: 2,
        timestamp: new Date().toISOString()
      }));
    } catch (e) {
      console.error('Error saving state:', e);
    }
  }
  
  // Load state from localStorage
  function loadState() {
    try {
      const savedData = localStorage.getItem('mbShoppingList');
      if (savedData) {
        const data = JSON.parse(savedData);
        
        if (data && Array.isArray(data.items)) {
          // Migrate from version 1 to version 2
          if (data.version === 1) {
            items = data.items.map(item => ({
              ...item,
              id: item.id || Date.now() + Math.random(),
              added: item.added || new Date().toISOString()
            }));
          } else {
            items = data.items;
          }
          
          // Load settings
          if (data.reverseAisles !== undefined) {
            reverseAisles = data.reverseAisles;
            updateReverseOrderButton();
          }
          
          
          render();
          setStatus(`Loaded ${items.length} items from your last session`);
        }
      }
    } catch (e) {
      console.error('Error loading saved state:', e);
      setStatus('Error loading saved data', true);
    }
  }
  
  // Helper function to escape HTML
  function escapeHtml(unsafe) {
    if (!unsafe) return '';
    return unsafe
      .toString()
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
  
  // Initialize the app when the DOM is loaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
